name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  HUSKY: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Enable task distribution via Nx Cloud
        run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="lint,test,build,build-compodoc,build-storybook"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Validate commit message format
        if: github.ref != 'refs/heads/main'
        env:
          COMMITLINT_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          COMMITLINT_TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: |
          if [[ -n "$COMMITLINT_FROM" && -n "$COMMITLINT_TO" ]]; then
            npx nx record -- commitlint --from $COMMITLINT_FROM --to $COMMITLINT_TO
          else
            npx nx record -- commitlint --last
          fi

      - name: Check for un-formatted files
        run: npx nx record -- nx format:check

      - name: Run lint, test, and build for affected projects
        timeout-minutes: 30
        run: npx nx affected -t lint test build build-compodoc build-storybook

      - name: Fix CI issues
        if: failure()
        run: npx nx fix-ci

      - name: Check if build output exists
        id: check-build
        if: github.event_name == 'pull_request' && !cancelled()
        run: |
          if [ -d "dist" ] && [ -n "$(ls -A "dist" 2>/dev/null)" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy preview
        if: steps.check-build.outputs.exists == 'true' && !cancelled()
        uses: ./.github/actions/deploy-preview
        with:
          issue-number: ${{ github.event.pull_request.number }}
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}
