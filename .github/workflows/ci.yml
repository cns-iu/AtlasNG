# Thin caller: AtlasNG CI runs the reusable workflow nx-ci.yml (reusable workflows are prefixed
# with `nx-`). Triggers, permissions, and concurrency live here.
name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/nx-ci.yml
    with:
      targets: lint test build check-sass build-compodoc build-storybook
      deploy-preview: true
      netlify-filter: AtlasNG
    secrets:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
