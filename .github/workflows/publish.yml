# Thin caller: AtlasNG publishing runs the reusable workflow nx-release-publish.yml (reusable
# workflows are prefixed with `nx-`). npm trusted publishing is configured for this file name.
name: Publish

on:
  push:
    tags:
      - v*.*.*
      - '*@*.*.*'
  # Fallback for when GitHub skips tag events (more than three tags pushed at once)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    permissions:
      contents: write # GitHub Release for the libraries group
      id-token: write # needed for provenance data generation
    uses: ./.github/workflows/nx-release-publish.yml
    with:
      build-projects: tag:library,tag:tooling
      fixed-group: libraries
      release-notes-command: node tools/scripts/library-release-notes.mjs "$RELEASE_TAG"
    secrets:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
