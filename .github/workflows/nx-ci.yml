# Reusable workflow (workflow_call): CI for Nx workspaces. Reusable workflows are prefixed with
# `nx-`; AtlasNG's own entry points (ci.yml, publish.yml, storybook-gh-pages.yml) are thin callers.
# Callers own triggers, concurrency, and permissions (grant actions: read, contents: read, and
# pull-requests: write). The status check is named `<caller job> / main`, so a caller job named
# `ci` produces `ci / main`. See README.md in this directory for setup.
name: Nx CI

on:
  workflow_call:
    inputs:
      targets:
        description: Space-separated targets run with `nx affected -t`
        type: string
        required: false
        default: lint test build
      stop-agents-after:
        description: >-
          Comma-separated targets after which Nx Cloud agents stop. Defaults to the targets input,
          which fits when `nx affected` is the last distributed command.
        type: string
        required: false
        default: ''
      distribute-on:
        description: >-
          Nx Cloud distribution config (file path or agent spec); empty disables task distribution.
          When left at the default and that file doesn't exist, all tasks run on the CI runner.
        type: string
        required: false
        default: .nx/workflows/distribution-config.yaml
      vitest-max-workers:
        description: Value of VITEST_MAX_WORKERS, forwarded to Nx Cloud agents
        type: string
        required: false
        default: '2'
      affected-timeout-minutes:
        description: Timeout for the `nx affected` step
        type: number
        required: false
        default: 30
      node-version-file:
        description: File that pins the Node.js version
        type: string
        required: false
        default: .nvmrc
      playwright-browsers:
        description: >-
          Space-separated Playwright browsers to install (with caching) on the runner when task
          distribution is disabled. With distribution, install them in the Nx Agents launch template.
        type: string
        required: false
        default: ''
      commitlint:
        description: Validate commit messages with commitlint on branches other than the default branch
        type: boolean
        required: false
        default: true
      deploy-preview:
        description: >-
          Deploy a Netlify preview for pull requests, of preview-dir when set and otherwise with the
          caller's ./.github/actions/deploy-preview; skipped for fork pull requests or when
          NETLIFY_AUTH_TOKEN is empty
        type: boolean
        required: false
        default: false
      preview-dir:
        description: >-
          Build output deployed at the root of the preview URL (for example dist/apps/<app>/browser),
          with a catch-all rewrite to index.html for client-side routing. Skipped when the directory
          has no index.html, such as when the app is not affected.
        type: string
        required: false
        default: ''
      netlify-filter:
        description: Netlify monorepo filter (site package name) for the preview deploy; empty passes no filter
        type: string
        required: false
        default: ''
    secrets:
      NX_CLOUD_ACCESS_TOKEN:
        description: Nx Cloud access token
        required: false
      NETLIFY_AUTH_TOKEN:
        description: Netlify auth token, required when deploy-preview is true
        required: false
      NETLIFY_SITE_ID:
        description: Netlify site ID, required when deploy-preview is true
        required: false

env:
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  VITEST_MAX_WORKERS: ${{ inputs.vitest-max-workers }}
  HUSKY: 0

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Enable task distribution via Nx Cloud
        if: inputs.distribute-on != ''
        env:
          DISTRIBUTE_ON: ${{ inputs.distribute-on }}
          STOP_AGENTS_AFTER: ${{ inputs.stop-agents-after }}
          TARGETS: ${{ inputs.targets }}
        run: |
          if [[ "$DISTRIBUTE_ON" == .nx/workflows/distribution-config.yaml && ! -f "$DISTRIBUTE_ON" ]]; then
            echo "::notice::$DISTRIBUTE_ON not found; running all tasks on the CI runner without Nx Agents"
            exit 0
          fi
          if [[ -z "$STOP_AGENTS_AFTER" ]]; then
            read -ra targets <<< "$TARGETS"
            STOP_AGENTS_AFTER=$(IFS=,; echo "${targets[*]}")
          fi
          npx nx start-ci-run \
            --distribute-on="$DISTRIBUTE_ON" \
            --with-env-vars="VITEST_MAX_WORKERS" \
            --stop-agents-after="$STOP_AGENTS_AFTER"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v5

      - name: Resolve Playwright version
        id: playwright
        if: inputs.distribute-on == '' && inputs.playwright-browsers != ''
        run: echo "version=$(node -p 'require("playwright/package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        if: steps.playwright.outcome == 'success'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ inputs.playwright-browsers }}

      # System dependencies are not cached; `--with-deps` installs them on every run.
      - name: Install Playwright browsers
        if: steps.playwright.outcome == 'success'
        env:
          BROWSERS: ${{ inputs.playwright-browsers }}
        # BROWSERS is intentionally unquoted so each space-separated browser becomes its own argument.
        run: npx playwright install --with-deps $BROWSERS

      - name: Validate commit message format
        if: inputs.commitlint && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COMMITLINT_FROM: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          COMMITLINT_TO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
        run: |
          if [[ -n "$COMMITLINT_FROM" && -n "$COMMITLINT_TO" ]]; then
            npx nx record -- commitlint --from $COMMITLINT_FROM --to $COMMITLINT_TO
          else
            npx nx record -- commitlint --last
          fi

      - name: Check for un-formatted files
        run: npx nx record -- nx format:check

      # Fails when files managed by sync generators (such as @atlasng/nx-plugin:sync) drifted.
      - name: Check workspace sync
        run: npx nx record -- nx sync:check

      - name: Run affected targets
        timeout-minutes: ${{ inputs.affected-timeout-minutes }}
        env:
          TARGETS: ${{ inputs.targets }}
        # TARGETS is intentionally unquoted so each space-separated target becomes its own argument.
        run: npx nx affected -t $TARGETS

      - name: Fix CI issues
        if: failure()
        run: npx nx fix-ci

      # Fork PRs get no secrets and a read-only token, so the deploy and its PR comment would fail.
      - name: Check preview deploy eligibility
        id: preview
        if: inputs.deploy-preview && github.event_name == 'pull_request' && !cancelled()
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          reason=''
          if [[ "$IS_FORK" == 'true' ]]; then
            reason='pull requests from forks do not receive repository secrets'
          elif [[ -z "$NETLIFY_AUTH_TOKEN" ]]; then
            reason='the NETLIFY_AUTH_TOKEN secret is not set'
          fi
          if [[ -n "$reason" ]]; then
            echo "::notice title=Preview deploy skipped::Skipped because $reason."
            printf '### :warning: Preview deploy skipped\n\nSkipped because %s.\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy preview
        if: steps.preview.outputs.deploy == 'true' && inputs.preview-dir == '' && !cancelled()
        uses: ./.github/actions/deploy-preview
        with:
          issue-number: ${{ github.event.pull_request.number }}
          commit-sha: ${{ github.event.pull_request.head.sha }}
          netlify-auth-token: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          netlify-site-id: ${{ secrets.NETLIFY_SITE_ID }}
          netlify-filter: ${{ inputs.netlify-filter }}

      - name: Deploy single-app preview
        id: app-preview
        if: steps.preview.outputs.deploy == 'true' && inputs.preview-dir != '' && !cancelled()
        env:
          PREVIEW_DIR: ${{ inputs.preview-dir }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_FILTER: ${{ inputs.netlify-filter }}
        run: |
          if [[ ! -f "$PREVIEW_DIR/index.html" ]]; then
            echo "::notice title=Preview deploy skipped::$PREVIEW_DIR/index.html does not exist."
            exit 0
          fi
          # Netlify reads _redirects; the catch-all rewrite lets a client-side router handle deep links.
          if [[ ! -f "$PREVIEW_DIR/_redirects" ]]; then
            echo '/* /index.html 200' > "$PREVIEW_DIR/_redirects"
          fi
          # With --json the CLI reports failures on stdout, so print the output before failing.
          status=0
          response=$(npx -y netlify-cli@26.0.0 deploy \
            --dir="$PREVIEW_DIR" \
            ${NETLIFY_FILTER:+--filter="$NETLIFY_FILTER"} \
            --alias="pr-$ISSUE_NUMBER" \
            --no-build \
            --json \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --site="$NETLIFY_SITE_ID") || status=$?
          echo "$response"
          if [[ $status -ne 0 ]]; then
            echo "::error title=Netlify deploy failed::netlify deploy exited with code $status."
            exit "$status"
          fi
          {
            echo "url=$(jq -r '.deploy_url' <<< "$response")"
            echo "sha=$(git rev-parse --short "$COMMIT_SHA")"
            echo "message=$(git log -1 --pretty=%s "$COMMIT_SHA")"
          } >> "$GITHUB_OUTPUT"

      - name: Find existing preview comment
        id: preview-comment
        if: steps.app-preview.outputs.url != '' && !cancelled()
        uses: peter-evans/find-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Preview Deploy Report'

      - name: Create or update preview comment
        if: steps.app-preview.outputs.url != '' && !cancelled()
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.preview-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            # :rocket: Preview Deploy Report

            ✅ Successfully deployed preview [here](${{ steps.app-preview.outputs.url }})

            Commit: `${{ steps.app-preview.outputs.sha }}` ${{ steps.app-preview.outputs.message }}
