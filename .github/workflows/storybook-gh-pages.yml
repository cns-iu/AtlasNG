# Thin caller: deploys the internal Storybook with the reusable workflow nx-storybook-gh-pages.yml
# (reusable workflows are prefixed with `nx-`).
name: Storybook GH Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storybook-pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/nx-storybook-gh-pages.yml
    with:
      project: internal-storybook
      configuration: ci
      output-dir: ./dist/storybook/internal-storybook
    secrets:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
