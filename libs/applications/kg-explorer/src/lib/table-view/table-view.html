<mat-sidenav-container class="ang-kg-explorer-table-view--container">
  <mat-sidenav
    class="ang-kg-explorer-table-view--sidenav"
    [mode]="docked() ? 'side' : 'over'"
    [opened]="filtersOpen()"
    (openedChange)="this.filtersOpen.set($event)"
  >
    <ang-scroll-area class="ang-kg-explorer-table-view--scroll-area">
      @let options = filterOptions();
      <ang-kg-explorer-filter-drawer
        [breadcrumbs]="options.breadcrumbs ?? []"
        [heading]="options.filtersHeading"
        [description]="options.filtersDescription"
        [viewToggleOptions]="options.viewToggleOptions ?? []"
        [viewSettings]="options.viewSettings ?? []"
        [filters]="resolvedFilters()"
        [filterSelections]="resolvedSelections()"
        [config]="options"
        [(activeToggle)]="activeToggle"
        [(viewSettingValues)]="viewSettingValues"
        (selectionChange)="select($event.filter, $event.selected)"
        (clearClick)="clearAllFilters()"
        (resetClick)="resetView.emit()"
      />
    </ang-scroll-area>
  </mat-sidenav>

  <mat-sidenav-content class="ang-kg-explorer-table-view--content">
    <ang-kg-explorer-table-panel
      [rows]="items()"
      [columns]="resolvedColumns()"
      [rowFilter]="rowFilter()"
      [config]="resolvedConfig()"
      [(search)]="search"
      [(sorts)]="sorts"
      (clearClick)="clearAllFilters()"
    >
      <ng-content />
    </ang-kg-explorer-table-panel>
  </mat-sidenav-content>
</mat-sidenav-container>
