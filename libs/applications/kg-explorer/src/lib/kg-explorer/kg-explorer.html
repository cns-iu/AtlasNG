<mat-sidenav-container class="ang-kg-explorer--container">
  <mat-sidenav
    class="ang-kg-explorer--sidenav"
    [mode]="docked() ? 'side' : 'over'"
    [opened]="filtersOpen()"
    (openedChange)="this.filtersOpen.set($event)"
  >
    <div class="ang-kg-explorer--filters">
      @for (filter of filters(); track filter.id) {
        <ang-multi-select-filter
          [label]="filter.label"
          [options]="filter.options"
          [count]="filter.count"
          [searchDisabled]="filter.searchDisabled ?? false"
          [selected]="selectionOf(filter)"
          (selectedChange)="select(filter, $event)"
        />
      }
    </div>
  </mat-sidenav>

  <mat-sidenav-content class="ang-kg-explorer--content">
    <ang-kg-explorer-results-table
      [rows]="items()"
      [columns]="resolvedColumns()"
      [searchFn]="searchFn()"
      [searchLabelFn]="searchLabelFn()"
      [searchDisabled]="searchDisabled()"
      [resultsCounterDisabled]="resultsCounterDisabled()"
      [endOfResultsDisabled]="endOfResultsDisabled()"
      [tableEndTemplate]="tableEndSlot()?.template"
      [(search)]="search"
      [(sorts)]="sorts"
      (clearResults)="clearAllFilters()"
    />
  </mat-sidenav-content>
</mat-sidenav-container>
