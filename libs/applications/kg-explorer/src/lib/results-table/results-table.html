@let results = filteredRows();

<ang-scroll-area class="ang-kg-explorer-results-table--scroll-area" orientation="vertical">
  <div class="ang-kg-explorer-results-table--container">
    @if (!searchDisabled() || !resultsCounterDisabled()) {
      <ang-kg-explorer-results-navigation
        class="ang-kg-explorer-results-table--navigation"
        [searchLabel]="searchLabel()"
        [suggestions]="suggestions()"
        [suggestionsDisabled]="!searchLabelFn()"
        [count]="results.length"
        [total]="rows().length"
        [searchDisabled]="searchDisabled()"
        [resultsCounterDisabled]="resultsCounterDisabled()"
        [(search)]="search"
      />
    }

    <ang-table
      class="ang-kg-explorer-results-table--table"
      appearance="none"
      [class.no-results]="results.length === 0"
      [rows]="results"
      [columns]="columns()"
      [(sorts)]="sorts"
    >
      <ang-no-results-indicator class="ang-kg-explorer-results-table--empty" empty-content (clear)="clear()" />
    </ang-table>

    @if (!endOfResultsDisabled() && results.length > 0) {
      <ang-end-of-results-indicator class="ang-kg-explorer-results-table--end" [count]="results.length" />
    }

    <ng-content />
  </div>
</ang-scroll-area>
