@if (!searchDisabled()) {
  <mat-form-field class="ang-kg-explorer-results-navigation--search" subscriptSizing="dynamic">
    <mat-icon matPrefix fontIcon="search" />
    <mat-label>{{ searchLabel() }}</mat-label>
    <input
      matInput
      type="search"
      [value]="search()"
      [matAutocomplete]="autocomplete"
      [matAutocompleteDisabled]="suggestionsDisabled()"
      (input)="search.set($any($event.target).value)"
    />
    @if (search()) {
      <button matIconButton matSuffix type="button" aria-label="Clear search" (click)="search.set('')">
        <mat-icon fontIcon="close" />
      </button>
    }
    <mat-autocomplete (optionSelected)="search.set($event.option.value)" #autocomplete="matAutocomplete">
      @for (suggestion of suggestions(); track suggestion) {
        <mat-option [value]="suggestion">{{ suggestion }}</mat-option>
      }
    </mat-autocomplete>
  </mat-form-field>
}

@if (!resultsCounterDisabled()) {
  <ang-results-indicator
    class="ang-kg-explorer-results-navigation--counter"
    prefix="Viewing"
    [value]="count()"
    [total]="total()"
  />
}
