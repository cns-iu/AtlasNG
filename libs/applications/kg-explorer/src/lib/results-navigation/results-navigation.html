@if (!searchDisabled()) {
  <ang-search-field
    class="ang-kg-explorer-results-navigation--search"
    [label]="searchLabel()"
    [suggestions]="suggestions()"
    [(value)]="search"
  />
}

@if (!resultsCounterDisabled()) {
  <ang-results-indicator
    class="ang-kg-explorer-results-navigation--counter"
    prefix="Viewing"
    [value]="count()"
    [total]="total()"
  />
}
