@if (!config().disableSearch) {
  <ang-search-field
    class="ang-kg-explorer-table-toolbar--search"
    [label]="config().searchLabel ?? 'Search'"
    [suggestions]="suggestions()"
    [(value)]="search"
  />
}

@if (!config().disableResultsCounter) {
  <ang-results-indicator
    class="ang-kg-explorer-table-toolbar--counter"
    [prefix]="config().resultsCounterPrefix ?? ''"
    [value]="count()"
    [total]="total()"
  />
}
