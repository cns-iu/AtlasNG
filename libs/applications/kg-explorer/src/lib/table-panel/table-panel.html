@let matches = results();
@let options = config();

<div class="ang-kg-explorer-table-panel--container">
  @if (!options.disableSearch || !options.disableResultsCounter) {
    <ang-kg-explorer-table-toolbar
      class="ang-kg-explorer-table-panel--toolbar"
      [suggestions]="suggestions()"
      [count]="matches.length"
      [total]="rows().length"
      [config]="options"
      [(search)]="search"
    />
  }

  <ang-table
    class="ang-kg-explorer-table-panel--table"
    appearance="none"
    [class.no-results]="matches.length === 0"
    [aria-label]="options.tableLabel ?? 'Results'"
    [rows]="matches"
    [columns]="columns()"
    [(sorts)]="sorts"
  >
    <ang-no-results-indicator class="ang-kg-explorer-table-panel--empty" empty-content (clearClick)="clear()" />
  </ang-table>

  @if (!options.disableEndOfResults && matches.length > 0) {
    <ang-end-of-results-indicator class="ang-kg-explorer-table-panel--end" [count]="matches.length" />
  }
</div>

<ng-content />
