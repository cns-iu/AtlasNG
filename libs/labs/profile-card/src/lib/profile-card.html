<div class="picture">
  <img [attr.src]="pictureUrl()" [attr.alt]="`Profile picture of ${name()}`" />
</div>
<div class="content">
  @if (nameLink()) {
    <a angTextLink class="name" target="_blank" [angAnyLink]="nameLink()">
      {{ name() }}
    </a>
  } @else {
    <div class="name">{{ name() }}</div>
  }
  <p class="description">{{ description() }}</p>
</div>
@if (variant() === 'default') {
  <div class="actions">
    <ng-content />
  </div>
}
