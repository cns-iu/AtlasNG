<table mat-table matSort aria-label="Table with sort function" [dataSource]="dataSource">
  @for (col of columns(); track col.column) {
    <ng-container [matColumnDef]="col.column">
      <th *matHeaderCellDef mat-header-cell mat-sort-header [class.align-right]="col.align === 'right'">
        {{ col.label }}
      </th>
      <td *matCellDef="let element" mat-cell>
        @if (typeof element[col.column] === 'string') {
          {{ element[col.column] }}
        }
        @if (typeof element[col.column] === 'number') {
          <div style="text-align: right">
            {{ element[col.column] }}
          </div>
        }
        @if (typeof element[col.column] === 'object') {
          <a angTextLink target="_blank" [href]="element[col.column].link">
            {{ element[col.column].label }}
          </a>
        }
      </td>
    </ng-container>
  }

  <tr *matHeaderRowDef="columnIds(); sticky: stickyHeader()" mat-header-row></tr>
  <tr *matRowDef="let row; columns: columnIds()" mat-row></tr>
</table>
