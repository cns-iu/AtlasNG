<mat-button-toggle-group
  [value]="preference()"
  [disabled]="disabled()"
  [attr.aria-label]="ariaLabel()"
  (change)="handlePreferenceChange($event)"
>
  <mat-button-toggle value="light">Light</mat-button-toggle>
  <mat-button-toggle value="dark">Dark</mat-button-toggle>
  <mat-button-toggle value="system">Device settings</mat-button-toggle>
</mat-button-toggle-group>
