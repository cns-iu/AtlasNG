@for (item of items(); track $index) {
  @let provider = item.provider;

  <div class="ang-provider-list--card" [angEventScope]="provider.label.toLowerCase()">
    <span class="ang-provider-list--label" [attr.id]="item.labelId">{{ provider.label }}</span>
    <a
      class="ang-provider-list--link"
      angTextLink
      target="_blank"
      [angAnyLink]="provider.href"
      [attr.aria-labelledby]="`${item.linkTextId} ${item.labelId}`"
    >
      <span [attr.id]="item.linkTextId">Learn more about this provider</span>
      <mat-icon fontIcon="open_in_new" />
    </a>
  </div>
} @empty {
  <div class="ang-provider-list--card">
    <p class="ang-provider-list--empty-text">We do not use cookies or technology of this type</p>
  </div>
}
