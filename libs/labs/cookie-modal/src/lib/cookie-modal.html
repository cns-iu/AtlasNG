<h2 matDialogTitle class="ang-cookie-modal--header">
  <!-- <h2>Cookie Policy</h2> -->
</h2>

<mat-tab-group matDialogContent class="ang-cookie-modal--tabs" [(selectedIndex)]="activeTab">
  <mat-tab label="Consent">
    <div class="ang-cookie-modal--content">
      <p>This website uses cookies and similar technologies.</p>
      <p>
        We use anonymized statistics data insights to improve our website. Marketing cookies are needed to watch videos
        on this website.
      </p>
    </div>
  </mat-tab>

  <mat-tab label="Details">
    <ang-cookie-permissions class="ang-cookie-modal--content" [providers]="providers" [(permissions)]="permissions" />
  </mat-tab>
</mat-tab-group>

<div matDialogActions class="ang-cookie-modal--actions" align="center">
  <button matButton="filled" matDialogClose="TODO">Allow necessary only</button>

  @if (activeTab() === 0) {
    <button matButton="outlined" (click)="activeTab.set(1)">Customize</button>
  } @else {
    <button matButton="filled" matDialogClose="TODO">Allow Selection</button>
  }

  <button matButton="filled" matDialogClose="TODO">Allow all</button>
</div>
