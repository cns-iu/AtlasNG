<cdk-accordion class="ang-cookie-permissions--list">
  @for (item of info(); track item.category) {
    <ang-cookie-permission-item
      [angEventScope]="item.category.toLowerCase()"
      [info]="item"
      [enabled]="permissions().isCategoryEnabled(item.category)"
      [providers]="providers()[item.category] ?? []"
      (enabledChange)="updatePermissions(item.category, $event)"
    />

    @if (!$last) {
      <mat-divider class="ang-cookie-permissions--divider" />
    }
  }
</cdk-accordion>
