<mat-drawer-container class="example-container" hasBackdrop>
  <mat-drawer
    mode="over"
    position="start"
    role="navigation"
    [id]="leftMenuId"
    [attr.aria-label]="leftMenuLabel()"
    [opened]="leftMenuOpen()"
    (openedChange)="leftMenuOpen.set($event)"
  >
    <ang-navigation-menu
      [navigationItems]="navigationItems()"
      [email]="email()"
      [socialMediaIds]="socialMediaIds()"
      (linkClick)="leftMenuOpen.set(false)"
    />
  </mat-drawer>

  <mat-drawer
    class="right"
    mode="over"
    position="end"
    role="navigation"
    [id]="rightMenuId"
    [attr.aria-label]="rightMenuLabel()"
    [opened]="rightMenuOpen()"
    (openedChange)="rightMenuOpen.set($event)"
  >
    <ang-navigation-menu
      [navigationItems]="navRight()"
      [email]="email()"
      [socialMediaIds]="socialMediaIds()"
      (linkClick)="rightMenuOpen.set(false)"
    />
  </mat-drawer>

  <mat-drawer-content>
    <ng-content />
  </mat-drawer-content>
</mat-drawer-container>
