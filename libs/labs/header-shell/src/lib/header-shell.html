<ang-skip-link [anchorId]="skipLinkAnchorId()" />
<header class="ang-header-shell">
  <div class="ang-header-shell-left">
    @if (localNavigation()) {
      <button
        matIconButton
        angEventScope="local-navigation"
        angTrackClick
        type="button"
        class="ang-header-shell-menu-button"
        [matTooltip]="localNavigationExpanded() ? 'Collapse local navigation' : 'Expand local navigation'"
        [attr.aria-label]="localNavigationLabel()"
        [attr.aria-expanded]="localNavigationExpanded()"
        [attr.aria-controls]="localNavigationControls()"
        (click)="localNavigationClick.emit()"
      >
        <mat-icon [fontIcon]="localNavigationIcon()" />
      </button>
    }
    <a
      class="ang-header-shell-logo"
      angEventScope="logo"
      angTrackClick
      [attr.aria-label]="logoLabel()"
      [matTooltip]="logoTooltip()"
      [angAnyLink]="logoLink()"
    >
      <img alt="App Logo" [src]="logoSrc()" />
    </a>
    <mat-divider vertical class="ang-header-shell-divider" />
  </div>

  <nav class="ang-header-shell-desktop-nav" [attr.aria-label]="navigationLabel()">
    @for (item of navigationItems(); track item.id) {
      @if (item.external) {
        <ang-navigation-button [link]="item.link">
          {{ item.label }}
        </ang-navigation-button>
      } @else {
        <a
          matButton
          angEventScope="navigation"
          angTrackClick
          class="ang-header-shell-navigation-button"
          disableRipple
          [angAnyLink]="item.link"
        >
          <span class="ang-header-shell-navigation-text">{{ item.label }}</span>
        </a>
      }
    }
  </nav>

  <div class="ang-header-shell-right">
    <div class="ang-header-shell--actions">
      <ng-content select="[angHeaderShellAction]" />
    </div>

    @if (helpLink()) {
      <div class="ang-header-shell-right-fixed">
        <ang-help-button [link]="helpLink()" />
      </div>
    }

    <div class="ang-header-shell-apps">
      <button
        matIconButton
        angEventScope="apps"
        angTrackClick
        type="button"
        class="ang-header-shell-icon-button"
        matTooltip="Apps"
        [attr.aria-label]="appsMenuLabel()"
        [attr.aria-expanded]="appsMenuExpanded()"
        [attr.aria-controls]="appsMenuControls()"
        (click)="appsMenuClick.emit()"
      >
        <mat-icon fontIcon="apps" />
      </button>
    </div>
  </div>
</header>
