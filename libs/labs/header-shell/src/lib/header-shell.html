<header class="ang-header-shell" #bar>
  <div class="ang-header-shell-left" #left>
    <!-- @if (hasLocalNavigation()) { -->
    <button
      matIconButton
      angTrackClick
      type="button"
      class="ang-header-shell-menu-button"
      [attr.aria-label]="localNavigationExpanded() ? 'Collapse local navigation' : 'Expand local navigation'"
      (click)="localNavigationToggle.emit()"
    >
      <mat-icon [fontIcon]="localNavigationIcon()" />
    </button>
    <!-- } -->

    <!-- <a matButton angTrackClick class="ang-header-shell-logo" aria-label="Go to homepage" [angAnyLink]="logoLink()">
      <ng-content select="[angHeaderShellLogo]">Logo</ng-content>
    </a> -->

    <a
      class="ang-header-shell-logo"
      aria-label="Go to homepage"
      target="_blank"
      matTooltip="Homepage"
      [angAnyLink]="logoLink()"
    >
      <img alt="App Logo" [src]="logoUrl()" />
    </a>

    <span class="ang-header-shell-divider" aria-hidden="true"></span>
  </div>

  <nav class="ang-header-shell-desktop-nav" aria-label="Primary navigation" #desktopNav>
    @for (item of navigationItems(); track item.id) {
      @if (item.menu) {
        <ang-navigation-toggle
          angTrackClick
          [selected]="openedNavigationMenuId() === item.id"
          [matMenuTriggerFor]="item.menu"
          [matTooltip]="item.tooltip"
          (menuOpened)="openNavigationMenu(item.id)"
          (menuClosed)="closeNavigationMenu(item.id)"
        >
          {{ item.label }}
        </ang-navigation-toggle>
      } @else {
        <ang-navigation-button [link]="item.link">
          {{ item.label }}
        </ang-navigation-button>
      }
    }
  </nav>
