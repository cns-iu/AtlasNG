<ang-error-page>
  <ang-error-page-title>Oops! We’re having a moment.</ang-error-page-title>
  <ang-error-page-description>Try refreshing the page or report the issue if it continues.</ang-error-page-description>
  <ang-error-page-actions>
    <a matButton="filled" target="_blank" [angAnyLink]="reportIssueLink()"> Report issue </a>
    <a matButton angAnyLink="/"> Go to homepage </a>
  </ang-error-page-actions>
</ang-error-page>
