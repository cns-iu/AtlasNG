<ang-error-page>
  <ang-error-page-title>Oops! We’re having a moment.</ang-error-page-title>
  <ang-error-page-description>Try refreshing the page or report the issue if it continues.</ang-error-page-description>
  <a
    angErrorPageAction
    matButton="filled"
    angEventScope="report-issue"
    angTrackClick
    target="_blank"
    [angAnyLink]="reportIssueLink()"
  >
    Report issue
  </a>
  <a angErrorPageAction matButton angEventScope="homepage" angTrackClick angAnyLink="/"> Go to homepage </a>
</ang-error-page>
