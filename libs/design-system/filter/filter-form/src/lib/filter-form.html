<div class="ang-filter-form--row">
  <div class="ang-filter-form--button-group">
    @if (info()) {
      <button class="ang-filter-form--info" matIconButton angTrackClick aria-label="Filter info" [matTooltip]="info()">
        <mat-icon fontIcon="info" />
      </button>
    }

    <button class="ang-filter-form--category" matButton angTrackClick (click)="actionClick.emit()">
      {{ category() }}
    </button>

    <span class="ang-filter-form--counter" matTooltip="Number of unique items per filter category">
      {{ uniqueItemCount() | number }}
    </span>
  </div>

  @if (hasChips()) {
    <mat-chip-set class="ang-filter-form--chips" aria-label="Active filters">
      @for (chip of chips(); track chip) {
        <mat-chip disableRipple (removed)="removeChip(chip)">
          {{ chip.label }}
          <button matChipRemove [aria-label]="`Remove ${chip.label}`">
            <mat-icon fontIcon="cancel" />
          </button>
        </mat-chip>
      }
    </mat-chip-set>
  }
</div>

@if (showDivider()) {
  <mat-divider class="ang-filter-form--divider" />
}
