<div class="link">
  <a mat-icon-button aria-label="Open link" tabindex="0" [attr.href]="url()">
    <mat-icon>open_in_new</mat-icon>
  </a>
  <div class="text">
    {{ url() }}
  </div>
</div>
<button mat-button class="copy" (click)="copyUrl()">
  <mat-icon>content_copy</mat-icon>
  Copy
</button>
