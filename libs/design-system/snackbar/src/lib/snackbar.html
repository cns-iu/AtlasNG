<span matSnackBarLabel class="label">{{ data.message }}</span>
<div matSnackBarActions class="actions">
  @if (data.action) {
    <span matSnackBarActions>
      <button matButton matSnackBarAction disableRipple (click)="snackbarRef.dismissWithAction()">
        {{ data.action }}
      </button>
    </span>
  }

  @if (data.showClose) {
    <button matIconButton matSnackBarAction alt="Close snack bar" (click)="snackbarRef.dismiss()">
      <mat-icon fontIcon="close" />
    </button>
  }
</div>
