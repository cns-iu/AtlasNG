<span matSnackBarLabel class="ang-snackbar--label">{{ data.message }}</span>
<div matSnackBarActions class="ang-snackbar--actions">
  @if (data.action) {
    <button type="button" matButton matSnackBarAction disableRipple (click)="snackbarRef.dismissWithAction()">
      {{ data.action }}
    </button>
  }

  @if (data.showClose) {
    <button type="button" matIconButton matSnackBarAction aria-label="Close snack bar" (click)="snackbarRef.dismiss()">
      <mat-icon fontIcon="close" />
    </button>
  }
</div>
