<ng-template>
  <div class="ang-rich-tooltip" role="dialog" [id]="id" [attr.aria-labelledby]="hasTagline() ? taglineId : null">
    @if (hasTagline()) {
      <div class="ang-rich-tooltip--tagline" [id]="taglineId">
        <ng-content select="ang-rich-tooltip-tagline">{{ tagline() }}</ng-content>
      </div>
    }
    @if (hasContent()) {
      <div class="ang-rich-tooltip--content">
        <ng-content select="ang-rich-tooltip-content">{{ description() }}</ng-content>
      </div>
    }
    @if (hasActions()) {
      <div class="ang-rich-tooltip--actions">
        <ng-content select="ang-rich-tooltip-action, [angRichTooltipAction]">
          <button matButton type="button" class="ang-rich-tooltip--action" (click)="actionClick.emit()">
            {{ actionText() }}
          </button>
        </ng-content>
      </div>
    }
  </div>
</ng-template>
