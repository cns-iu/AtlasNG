@let socialData = data(); @if (socialData) {
<a
  mat-icon-button
  hraFeature="social-media"
  hraClickEvent
  target="_blank"
  rel="noopener noreferrer"
  [matTooltip]="socialData.label"
  [attr.aria-label]="socialData.label"
  [attr.href]="socialData.link"
>
  <div class="social icon" [style.mask]="imageUrl(socialData.id)"></div>
</a>
}
