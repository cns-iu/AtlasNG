<footer class="ang-footer--container">
  <div class="ang-footer--logo-container">
    <ng-content select="ang-footer-logo, [angFooterLogo]">
      <a
        class="ang-footer--logo"
        angEventScope="logo"
        angTrackClick
        [matTooltip]="logoTooltip()"
        [angAnyLink]="logoLink()"
        [attr.aria-label]="resolvedLogoLabel()"
      >
        <img class="ang-footer--logo-image" fill alt="Logo" loading="eager" [ngSrc]="logoSrc()" />
      </a>
    </ng-content>
  </div>

  @let socials = this.socials() || [];
  @if (socials.length) {
    <div
      class="ang-footer--social-icons"
      role="group"
      [attr.aria-label]="socialsLabel()"
      [style.--ang-footer--social-icon-count]="socials.length"
    >
      @for (social of socials; track $index) {
        <ang-social-media-button class="ang-footer--social-icon" [social]="social" />
      }
    </div>
  }

  <div class="ang-footer--actions">
    <ng-content select="ang-footer-action, [angFooterAction]">
      <button
        type="button"
        matButton
        class="ang-footer--action"
        angEventScope="privacy-preferences"
        angTrackClick
        (click)="privacyPreferencesClick.emit()"
      >
        Privacy Preferences
      </button>
      <button
        type="button"
        matButton
        class="ang-footer--action"
        angEventScope="privacy-policy"
        angTrackClick
        (click)="privacyPolicyClick.emit()"
      >
        Privacy Policy
      </button>
    </ng-content>
  </div>

  <span class="ang-footer--copyright">
    © {{ copyrightYear() }} Copyright {{ organization() }}. All rights reserved.
  </span>
</footer>
