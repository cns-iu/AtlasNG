@if (!searchDisabled()) {
  <mat-form-field class="ang-search-list--search" subscriptSizing="dynamic">
    <mat-label>Search</mat-label>
    <mat-icon matPrefix fontIcon="search" />
    <input matInput type="text" [(ngModel)]="search" />
  </mat-form-field>
}

<mat-selection-list class="ang-search-list--list" (selectionChange)="updateSelection($event)">
  @for (result of results(); track result.item) {
    @let option = result.item;
    <mat-list-option togglePosition="before" [value]="option" [selected]="selected().includes(option)">
      <div matListItemTitle>
        <div class="ang-search-list--label-count">
          <span
            class="ang-search-list--label"
            [angSearchHighlight]="option.label"
            [angSearchHighlightRanges]="getRanges(result, 'label')"
          ></span>
          <span class="ang-search-list--count">{{ option.count | number }}</span>
        </div>
      </div>
      @for (line of normalizeDescription(option.description); track $index) {
        <span
          class="ang-search-list--description"
          matListItemLine
          [angSearchHighlight]="line"
          [angSearchHighlightRanges]="getRanges(result, 'description', $index)"
        ></span>
      }
    </mat-list-option>
  }
</mat-selection-list>
