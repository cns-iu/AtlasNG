@if (!disableSearch()) {
  <mat-form-field class="ang-search-list--search" subscriptSizing="dynamic">
    <mat-label>{{ searchLabel() }}</mat-label>
    <mat-icon matPrefix fontIcon="search" />
    <input matInput angTrackChange type="text" [(ngModel)]="search" />
  </mat-form-field>
}

<ang-scroll-area class="ang-search-list--scroll-area" orientation="vertical">
  <mat-selection-list
    class="ang-search-list--list"
    angTrackChange
    [attr.aria-label]="ariaLabel()"
    [attr.aria-labelledby]="ariaLabelledby()"
    [angTrackChangeOn]="{ selectionChange: list.selectionChange }"
    (selectionChange)="updateSelection($event)"
    #list
  >
    @for (result of results(); track result.item) {
      @let option = result.item;
      <mat-list-option togglePosition="before" [value]="option" [selected]="selected().includes(option)">
        <div matListItemTitle>
          <div class="ang-search-list--label-count">
            <span
              class="ang-search-list--label"
              [angSearchHighlight]="option.label"
              [angSearchHighlightRanges]="getRanges(result, 'label')"
            ></span>
            <span class="ang-search-list--count">{{ option.count | number }}</span>
          </div>
        </div>
        @for (line of normalizeDescription(option.description); track $index) {
          <span
            class="ang-search-list--description"
            matListItemLine
            [angSearchHighlight]="line"
            [angSearchHighlightRanges]="getRanges(result, 'description', $index)"
          ></span>
        }
      </mat-list-option>
    }
  </mat-selection-list>

  @if (noResults()) {
    <div class="ang-search-list--no-results">
      <p class="ang-search-list--no-results-message">{{ noResultsMessage() }}</p>
      <button type="button" matButton angTrackClick (click)="clearSearch()">
        {{ clearSearchLabel() }}
      </button>
    </div>
  }
</ang-scroll-area>

<ng-container [angAnnounce]="announcement()" />
