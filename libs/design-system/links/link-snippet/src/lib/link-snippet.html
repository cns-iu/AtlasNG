<div class="ang-link-snippet--link">
  <a
    matIconButton
    angEventScope="open"
    angTrackClick
    target="_blank"
    rel="noopener noreferrer"
    [angAnyLink]="url()"
    [attr.aria-labelledby]="labelId"
    [attr.aria-describedby]="newTabHintId"
  >
    <mat-icon>open_in_new</mat-icon>
  </a>
  <span angVisuallyHidden [id]="newTabHintId">{{ newTabHint() }}</span>
  <ang-scroll-area class="ang-link-snippet--scroll-area" orientation="horizontal">
    <div class="ang-link-snippet--text" [attr.id]="labelId">
      {{ urlLabel() }}
    </div>
  </ang-scroll-area>
</div>
<button
  type="button"
  matButton="outlined"
  class="ang-link-snippet--copy"
  angEventScope="copy"
  angTrackClick
  [attr.aria-describedby]="labelId"
  (click)="copyUrl()"
>
  <mat-icon>content_copy</mat-icon>
  Copy
</button>
