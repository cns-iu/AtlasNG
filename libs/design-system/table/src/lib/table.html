<ngx-datatable
  class="ang-table--datatable"
  checkRowListChanges="false"
  checkRowPropertyChanges="false"
  columnMode="flex"
  enableClearingSortState="true"
  headerHeight="auto"
  reorderable="false"
  scrollbarV="true"
  scrollbarVDynamic="true"
  [columns]="resolvedColumns()"
  [rows]="rows()"
  [rowHeight]="rowHeight()"
  [virtualization]="virtualization()"
  [scrollbarH]="scrollbarH()"
  [selectionType]="selectionType()"
  [sortType]="sortType()"
  [summaryRow]="summaryRow()"
  [summaryHeight]="resolvedSummaryHeight()"
  [summaryPosition]="summaryPosition()"
  [(selected)]="selected"
  [(sorts)]="sorts"
>
  <ng-content select="[empty-content]" ngProjectAs="[empty-content]">
    <!-- TODO default empty state -->
  </ng-content>
</ngx-datatable>
