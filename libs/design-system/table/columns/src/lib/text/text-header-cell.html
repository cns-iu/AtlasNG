@let alignClass = `ang-table--text-header-align-${config.align ?? 'start'}`;

<ng-template let-column="column" let-sortFn="sortFn" angHeaderCellTemplateContext>
  @if (column.sortable) {
    <button cdkMonitorSubtreeFocus matRipple class="ang-table--text-header" [class]="alignClass" (click)="sortFn()">
      <span class="ang-table--text-header-label">{{ column.name }}</span>
      <mat-icon class="ang-table--sort-indicator" iconPositionEnd fontIcon="arrow_upward_alt" />
    </button>
  } @else {
    <div class="ang-table--text-header" [class]="alignClass">
      <span class="ang-table--text-header-label">{{ column.name }}</span>
    </div>
  }
</ng-template>
