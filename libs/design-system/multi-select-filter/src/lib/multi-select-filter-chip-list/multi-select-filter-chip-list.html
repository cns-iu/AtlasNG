<mat-chip-set class="ang-multi-select-filter-chip-list--chips" role="list" [attr.aria-label]="label()">
  @for (option of options(); track option) {
    <mat-chip
      role="listitem"
      disableRipple
      animate.enter="ang-multi-select-filter-chip-list--chip-enter"
      animate.leave="ang-multi-select-filter-chip-list--chip-leave"
      (removed)="removed.emit(option)"
    >
      {{ option.label }}
      <button type="button" matChipRemove [attr.aria-label]="`${removeLabel()} ${option.label}`">
        <mat-icon fontIcon="cancel" />
      </button>
    </mat-chip>
  }
</mat-chip-set>
