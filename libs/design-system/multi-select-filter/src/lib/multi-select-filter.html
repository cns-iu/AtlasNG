<div class="ang-multi-select-filter--header">
  @let tooltip = infoPanel();
  @if (tooltip) {
    <button
      type="button"
      class="ang-multi-select-filter--info"
      matIconButton
      angEventScope="info"
      angTrackClick
      [attr.aria-label]="resolvedInfoButtonLabel()"
      [matTooltip]="infoTooltip()"
      [matTooltipDisabled]="infoTrigger.isOpen()"
      [angRichTooltipTriggerFor]="tooltip"
      #infoTrigger="angRichTooltipTrigger"
    >
      <mat-icon fontIcon="info" />
    </button>
  }

  <button
    type="button"
    class="ang-multi-select-filter--label"
    matButton
    angEventScope="toggle"
    angTrackClick
    cdkOverlayOrigin
    aria-haspopup="dialog"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="expanded() ? panelId : null"
    (click)="toggle()"
    #panelOrigin="cdkOverlayOrigin"
  >
    {{ label() }}
  </button>

  <span class="ang-multi-select-filter--counter" tabindex="0" [matTooltip]="countTooltip()">
    {{ displayedCount() | number }}
  </span>
</div>

@if (selected().length > 0) {
  <mat-chip-set class="ang-multi-select-filter--chips" role="list" [attr.aria-label]="selectedFiltersLabel()">
    @for (option of selected(); track option) {
      <mat-chip role="listitem" disableRipple (removed)="removeFilter(option)">
        {{ option.label }}
        <button
          type="button"
          matChipRemove
          angEventScope="remove-filter"
          angTrackClick
          [attr.aria-label]="`${removeFilterLabel()} ${option.label}`"
        >
          <mat-icon fontIcon="cancel" />
        </button>
      </mat-chip>
    }
  </mat-chip-set>
}

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="panelOrigin"
  [cdkConnectedOverlayOpen]="expanded()"
  [cdkConnectedOverlayPositions]="panelPositions"
  (overlayOutsideClick)="close()"
  (overlayKeydown)="handlePanelKeydown($event)"
  (detach)="close()"
>
  <div
    class="ang-multi-select-filter--panel"
    role="dialog"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    [id]="panelId"
    [attr.aria-label]="label()"
  >
    <ang-search-list
      class="ang-multi-select-filter--search-list"
      [options]="options()"
      [disableSearch]="disableSearch()"
      [searchLabel]="searchLabel()"
      [sort]="sort()"
      [aria-label]="label()"
      [(selected)]="selected"
      [(search)]="search"
    />
  </div>
</ng-template>
