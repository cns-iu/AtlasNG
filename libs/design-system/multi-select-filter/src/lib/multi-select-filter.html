<div class="ang-multi-select-filter--header" cdkOverlayOrigin #panelOrigin="cdkOverlayOrigin">
  @let tooltip = infoPanel();
  @if (tooltip) {
    <button
      type="button"
      class="ang-multi-select-filter--info"
      matIconButton
      angEventScope="info"
      angTrackClick
      [attr.aria-label]="resolvedInfoButtonLabel()"
      [matTooltip]="infoTooltip()"
      [matTooltipDisabled]="infoTrigger.isOpen()"
      [angRichTooltipTriggerFor]="tooltip"
      #infoTrigger="angRichTooltipTrigger"
    >
      <mat-icon fontIcon="info" />
    </button>
  }

  <button
    type="button"
    class="ang-multi-select-filter--label"
    matButton
    angEventScope="toggle"
    angTrackClick
    aria-haspopup="dialog"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="expanded() ? panelId : null"
    (click)="toggle()"
  >
    {{ label() }}
  </button>

  <span class="ang-multi-select-filter--counter" tabindex="0" matTooltipPosition="after" [matTooltip]="countTooltip()">
    {{ displayedCount() | number }}
  </span>
</div>

@if (selected().length > 0) {
  <ang-multi-select-filter-chip-list
    [options]="selected()"
    [label]="selectedFiltersLabel()"
    [removeLabel]="removeFilterLabel()"
    (removed)="removeFilter($event)"
  />
}

<ng-template
  cdkConnectedOverlay
  cdkConnectedOverlayPanelClass="ang-multi-select-filter--panel-pane"
  [cdkConnectedOverlayOrigin]="panelOrigin"
  [cdkConnectedOverlayOpen]="expanded()"
  [cdkConnectedOverlayPositions]="panelPositions()"
  [cdkConnectedOverlayFlexibleDimensions]="wide()"
  [cdkConnectedOverlayPush]="!wide()"
  [cdkConnectedOverlayViewportMargin]="wide() ? 16 : 0"
  [cdkConnectedOverlayWidth]="wide() ? '' : '100%'"
  [cdkConnectedOverlayHeight]="wide() ? '' : '100%'"
  (overlayOutsideClick)="close()"
  (overlayKeydown)="handlePanelKeydown($event)"
  (detach)="close()"
>
  <div
    class="ang-multi-select-filter--panel"
    role="dialog"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    [class.ang-multi-select-filter--full-screen]="!wide()"
    [id]="panelId"
    [attr.aria-label]="wide() ? label() : resolvedDialogTitle()"
    [attr.aria-modal]="!wide() || null"
  >
    @if (!wide()) {
      <h2 class="ang-multi-select-filter--dialog-title">{{ resolvedDialogTitle() }}</h2>
    }

    <ang-search-list
      class="ang-multi-select-filter--search-list"
      [options]="options()"
      [disableSearch]="disableSearch()"
      [aria-label]="label()"
      [selected]="selected()"
      [(search)]="search"
      (selectedChange)="updateSelected($event)"
    />

    @if (!wide()) {
      <div class="ang-multi-select-filter--dialog-footer">
        @if (selected().length > 0) {
          <div
            class="ang-multi-select-filter--chip-tray"
            animate.enter="ang-multi-select-filter--chip-tray-enter"
            animate.leave="ang-multi-select-filter--chip-tray-leave"
          >
            <ang-scroll-area class="ang-multi-select-filter--chip-row" orientation="horizontal">
              <ang-multi-select-filter-chip-list
                class="ang-multi-select-filter--dialog-chips"
                singleRow
                [options]="selectedNewestFirst()"
                [label]="selectedFiltersLabel()"
                [removeLabel]="removeFilterLabel()"
                (removed)="removeFilter($event)"
              />
            </ang-scroll-area>
          </div>
        }
        <div class="ang-multi-select-filter--dialog-actions">
          <button type="button" matButton="filled" angTrackClick (click)="close()">{{ doneLabel() }}</button>
        </div>
      </div>
    }
  </div>
</ng-template>
