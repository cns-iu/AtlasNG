<div class="ang-multi-select-filter--header">
  @let tooltip = infoTooltip();
  @if (tooltip) {
    <button
      class="ang-multi-select-filter--info"
      matIconButton
      angTrackClick
      [attr.aria-label]="resolvedInfoLabel()"
      [matTooltip]="infoTooltipText()"
      [matTooltipDisabled]="infoTrigger.isOpen()"
      [angRichTooltipTriggerFor]="tooltip"
      #infoTrigger="angRichTooltipTrigger"
    >
      <mat-icon fontIcon="info" />
    </button>
  }

  <button
    class="ang-multi-select-filter--label"
    matButton
    angTrackClick
    cdkOverlayOrigin
    aria-haspopup="dialog"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="expanded() ? panelId : null"
    (click)="toggle()"
    #panelOrigin="cdkOverlayOrigin"
  >
    {{ label() }}
  </button>

  <span class="ang-multi-select-filter--counter" tabindex="0" [matTooltip]="countTooltipText()">
    {{ displayedCount() | number }}
  </span>
</div>

@if (selected().length > 0) {
  <mat-chip-set class="ang-multi-select-filter--chips" role="list" [attr.aria-label]="selectedLabel()">
    @for (option of selected(); track option) {
      <mat-chip role="listitem" disableRipple (removed)="removeFilter(option)">
        {{ option.label }}
        <button matChipRemove [attr.aria-label]="`${removeLabel()} ${option.label}`">
          <mat-icon fontIcon="cancel" />
        </button>
      </mat-chip>
    }
  </mat-chip-set>
}

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="panelOrigin"
  [cdkConnectedOverlayOpen]="expanded()"
  [cdkConnectedOverlayPositions]="panelPositions"
  (overlayOutsideClick)="close()"
  (overlayKeydown)="handlePanelKeydown($event)"
  (detach)="close()"
>
  <div
    class="ang-multi-select-filter--panel"
    role="dialog"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    [id]="panelId"
    [attr.aria-label]="label()"
  >
    <ang-search-list
      class="ang-multi-select-filter--search-list"
      [options]="options()"
      [searchDisabled]="searchDisabled()"
      [(selected)]="selected"
      [(search)]="search"
    />
  </div>
</ng-template>
