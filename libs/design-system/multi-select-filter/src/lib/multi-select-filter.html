<div class="ang-multi-select-filter--header" cdkOverlayOrigin #panelOrigin="cdkOverlayOrigin">
  @let tooltip = infoPanel();
  @if (tooltip) {
    <button
      type="button"
      class="ang-multi-select-filter--info"
      matIconButton
      angTrackClick
      [attr.aria-label]="resolvedInfoButtonLabel()"
      [matTooltip]="infoTooltip()"
      [matTooltipDisabled]="infoTrigger.isOpen()"
      [angRichTooltipTriggerFor]="tooltip"
      #infoTrigger="angRichTooltipTrigger"
    >
      <mat-icon fontIcon="info" />
    </button>
  }

  <button
    type="button"
    class="ang-multi-select-filter--label"
    matButton
    angTrackClick
    aria-haspopup="dialog"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="expanded() && wide() ? panelId : null"
    (click)="toggle()"
  >
    {{ label() }}
  </button>

  <span class="ang-multi-select-filter--counter" tabindex="0" matTooltipPosition="after" [matTooltip]="countTooltip()">
    {{ displayedCount() | number }}
  </span>
</div>

<ng-container [ngTemplateOutlet]="chips" />

<ng-template #chips>
  @if (selected().length > 0) {
    <mat-chip-set class="ang-multi-select-filter--chips" role="list" [attr.aria-label]="selectedFiltersLabel()">
      @for (option of selected(); track option) {
        <mat-chip
          role="listitem"
          disableRipple
          animate.enter="ang-multi-select-filter--chip-enter"
          animate.leave="ang-multi-select-filter--chip-leave"
          (removed)="removeFilter(option)"
        >
          {{ option.label }}
          <button type="button" matChipRemove [attr.aria-label]="`${removeFilterLabel()} ${option.label}`">
            <mat-icon fontIcon="cancel" />
          </button>
        </mat-chip>
      }
    </mat-chip-set>
  }
</ng-template>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="panelOrigin"
  [cdkConnectedOverlayOpen]="expanded() && wide()"
  [cdkConnectedOverlayPositions]="panelPositions()"
  (overlayOutsideClick)="close()"
  (overlayKeydown)="handlePanelKeydown($event)"
  (detach)="close()"
>
  <div
    class="ang-multi-select-filter--panel"
    role="dialog"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    [id]="panelId"
    [attr.aria-label]="label()"
  >
    <ang-search-list
      class="ang-multi-select-filter--search-list"
      [options]="options()"
      [disableSearch]="disableSearch()"
      [aria-label]="label()"
      [selected]="selected()"
      [(search)]="search"
      (selectedChange)="updateSelected($event)"
    />
  </div>
</ng-template>

<ng-template #dialog>
  <h2 class="ang-multi-select-filter--dialog-title" mat-dialog-title>{{ resolvedDialogTitle() }}</h2>
  <mat-dialog-content class="ang-multi-select-filter--dialog-content">
    <ang-search-list
      class="ang-multi-select-filter--search-list"
      [options]="options()"
      [disableSearch]="disableSearch()"
      [aria-label]="label()"
      [selected]="selected()"
      [(search)]="search"
      (selectedChange)="updateSelected($event)"
    />
  </mat-dialog-content>
  <div class="ang-multi-select-filter--dialog-footer">
    @if (selected().length > 0) {
      <div
        class="ang-multi-select-filter--chip-tray"
        animate.enter="ang-multi-select-filter--chip-tray-enter"
        animate.leave="ang-multi-select-filter--chip-tray-leave"
      >
        <ang-scroll-area class="ang-multi-select-filter--chip-row" orientation="horizontal">
          <ng-container [ngTemplateOutlet]="chips" />
        </ang-scroll-area>
      </div>
    }
    <mat-dialog-actions class="ang-multi-select-filter--dialog-actions" align="end">
      <button type="button" matButton="filled" mat-dialog-close angTrackClick>{{ doneLabel() }}</button>
    </mat-dialog-actions>
  </div>
</ng-template>
