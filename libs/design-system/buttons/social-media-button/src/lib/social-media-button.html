@let definition = resolvedDefinition();
<a matIconButton angTrackClick target="_blank" [attr.aria-label]="definition.label" [attr.href]="definition.url">
  @if (definition.icon; as icon) {
    <mat-icon [class]="definition.classes" [svgIcon]="icon" />
  } @else if (definition.fontIcon; as icon) {
    <mat-icon [class]="definition.classes" [fontIcon]="icon" />
  } @else {
    <div class="ang-social-media-button--mask-icon" [class]="definition.classes"></div>
  }
</a>
