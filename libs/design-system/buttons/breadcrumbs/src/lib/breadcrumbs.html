<nav class="navigation">
  <div class="crumbs">
    @for (crumb of crumbs(); track $index) {
      @if (crumb.route) {
        <a angTextLink class="crumb" [angAnyLink]="crumb.route">{{ crumb.name }}</a>
      } @else {
        <span class="crumb">{{ crumb.name }}</span>
      }

      @if (!$last) {
        <span class="separator">/</span>
      }
    }
  </div>
</nav>
