@if (menu(); as menuRef) {
  <button
    type="button"
    matIconButton
    angTrackClick
    matTooltip="Help & documentation"
    [attr.aria-label]="ariaLabel() ?? 'Open help menu'"
    [attr.aria-describedby]="ariaDescribedby()"
    [matMenuTriggerFor]="menuRef"
  >
    <mat-icon fontIcon="help" />
  </button>
} @else {
  <a
    matIconButton
    angTrackClick
    matTooltip="Help & documentation"
    target="_blank"
    [attr.aria-label]="ariaLabel() ?? 'Open help page in a new tab'"
    [attr.aria-describedby]="ariaDescribedby()"
    [angAnyLink]="link()"
  >
    <mat-icon fontIcon="help" />
  </a>
}
