@if (menu(); as menuRef) {
  <button
    matIconButton
    angTrackClick
    aria-label="Open help menu"
    matTooltip="Help & documentation"
    [matMenuTriggerFor]="menuRef"
  >
    <mat-icon fontIcon="help" />
  </button>
} @else {
  <a
    matIconButton
    angTrackClick
    aria-label="Open help page in a new tab"
    matTooltip="Help & documentation"
    target="_blank"
    [angAnyLink]="link()"
  >
    <mat-icon fontIcon="help" />
  </a>
}
