@if (menu(); as menuRef) {
  <button
    matIconButton
    angTrackClick
    aria-label="help button"
    matTooltip="Help & documentation"
    [matMenuTriggerFor]="menuRef"
  >
    <mat-icon fontIcon="help" />
  </button>
} @else {
  <a
    matIconButton
    angTrackClick
    target="_blank"
    aria-label="help button"
    matTooltip="Help & documentation"
    [attr.href]="link()"
  >
    <mat-icon fontIcon="help" />
  </a>
}
