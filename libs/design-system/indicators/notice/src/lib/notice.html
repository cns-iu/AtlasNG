<mat-icon class="ang-notice--icon" [fontIcon]="config().icon" />
<div class="ang-notice--content" [attr.role]="contentLabel() ? 'group' : null" [attr.aria-label]="contentLabel()">
  @if (tagline(); as tagline) {
    @if (level(); as level) {
      <ang-heading class="ang-notice--tagline" [level]="level" [tagline]="tagline" />
    } @else {
      <div class="ang-notice--tagline">{{ tagline }}</div>
    }
  }
  <div class="ang-notice--body"><ng-content /></div>
</div>
